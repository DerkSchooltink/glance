<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Glance">
  <!-- The Glance brand mark (tile + almond eye + screen pupil) in the Plivo palette: one flat
       brand blue, white and ink — no gradient. The tile corner follows plivo.com's mark (4/32).
       Simplified and enlarged for 16-32px: the eye is scaled up so it still reads at 16px. The
       rim adapts to the browser theme via prefers-color-scheme (dark rim on light chrome, light
       rim on dark chrome). -->
  <style>
    .rim { stroke: rgba(9, 9, 11, 0.16) }
    @media (prefers-color-scheme: dark) {
      .rim { stroke: rgba(255, 255, 255, 0.22) }
    }
  </style>
  <rect x="8" y="8" width="496" height="496" rx="62" fill="#323dfe"/>
  <rect x="14" y="14" width="484" height="484" rx="56" fill="none" class="rim" stroke-width="12"/>
  <path d="M256 132C356 132 442 196 476 256C442 316 356 380 256 380C156 380 70 316 36 256C70 196 156 132 256 132Z" fill="#ffffff"/>
  <rect x="184" y="184" width="144" height="144" rx="18" fill="#09090b"/>
  <rect x="208" y="222" width="92" height="20" rx="4" fill="#323dfe"/>
  <circle cx="300" cy="296" r="18" fill="#ffffff"/>
</svg>
